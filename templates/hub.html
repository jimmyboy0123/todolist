<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人事项 — Todo List</title>
  {% include '_assets_head.html' %}
</head>
<body>
  <header class="app-header">
    <div class="app-logo">📋 Todo List</div>
    <nav class="app-nav">
      <a href="/">首页</a>
      <a href="/hub">个人事项</a>
      <a href="/calendar">日历视图</a>
    </nav>
  </header>
  <main class="app-main">
    <div class="card">
      <div class="card-header">
        <h2 style="font-size:16px;font-weight:600;">待办事项</h2>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-primary" id="btn-create">+ 新建事项</button>
          <a href="/calendar" class="btn btn-outline">📅 日历视图</a>
        </div>
      </div>
      <div class="card-body">
        <div class="toolbar">
          <div class="filter-chips" id="scope-chips">
            <span class="chip active" data-scope="my">我的</span>
            <span class="chip" data-scope="department">部门</span>
            <span class="chip" data-scope="company">公司</span>
          </div>
          <select class="form-control" id="filter-status" style="width:auto;">
            <option value="">全部状态</option>
            <option value="open">待处理</option>
            <option value="in_progress">进行中</option>
            <option value="pending_review">待审核</option>
            <option value="done">已完成</option>
          </select>
          <input type="text" class="form-control" id="filter-search" placeholder="搜索标题..." style="max-width:200px;">
        </div>
        <div id="item-list" class="item-list"></div>
      </div>
    </div>
  </main>

  <!-- 新建/编辑弹窗 -->
  <div class="modal-overlay" id="item-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">新建事项</h3>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="f-id">
        <div class="form-group">
          <label>标题 *</label>
          <input type="text" class="form-control" id="f-title" placeholder="事项标题">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>范围</label>
            <select class="form-control" id="f-scope">
              <option value="my">我的</option>
              <option value="department">部门</option>
              <option value="company">公司</option>
            </select>
          </div>
          <div class="form-group">
            <label>类型</label>
            <select class="form-control" id="f-type"></select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>状态</label>
            <select class="form-control" id="f-status">
              <option value="open">待处理</option>
              <option value="in_progress">进行中</option>
              <option value="pending_review">待审核</option>
              <option value="done">已完成</option>
            </select>
          </div>
          <div class="form-group">
            <label>优先级</label>
            <select class="form-control" id="f-priority">
              <option value="urgent">紧急</option>
              <option value="high">高</option>
              <option value="normal" selected>普通</option>
              <option value="low">低</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>开始日期</label>
            <input type="date" class="form-control" id="f-start">
          </div>
          <div class="form-group">
            <label>截止日期</label>
            <input type="date" class="form-control" id="f-due">
          </div>
        </div>
        <div class="form-group">
          <label>负责人</label>
          <input type="text" class="form-control" id="f-assignee" placeholder="负责人姓名">
        </div>
        <div class="form-group">
          <label>内容</label>
          <textarea class="form-control" id="f-content" rows="3" placeholder="详细描述"></textarea>
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="f-recurring"> 周期事项</label>
        </div>
        <div class="form-group" id="freq-group" style="display:none;">
          <label>频率</label>
          <select class="form-control" id="f-frequency">
            <option value="daily">每天</option>
            <option value="weekly">每周</option>
            <option value="monthly">每月</option>
            <option value="quarterly">每季度</option>
            <option value="yearly">每年</option>
          </select>
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="f-regular"> 常规事项（日历下方列表展示）</label>
        </div>
        <div class="form-group" id="attachment-section">
          <label>附件</label>
          <p class="attachment-hint" id="attachment-hint">保存事项后可上传附件（单文件最大 20MB）</p>
          <div class="attachment-upload" id="attachment-upload" style="display:none;">
            <input type="file" id="f-attachment-input" class="attachment-input" multiple>
            <button type="button" class="btn btn-outline btn-sm" id="btn-pick-attachment">选择文件</button>
          </div>
          <ul class="attachment-list" id="attachment-list"></ul>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" id="modal-cancel">取消</button>
        <button class="btn btn-primary" id="modal-save">保存</button>
      </div>
    </div>
  </div>

  <!-- 详情弹窗 -->
  <div class="modal-overlay" id="detail-modal">
    <div class="modal" style="max-width:640px;">
      <div class="modal-header">
        <h3 id="detail-title">事项详情</h3>
        <button class="modal-close" id="detail-close">&times;</button>
      </div>
      <div class="modal-body" id="detail-body"></div>
      <div class="modal-footer">
        <button class="btn btn-danger btn-sm" id="detail-delete">删除</button>
        <button class="btn btn-outline" id="detail-edit">编辑</button>
      </div>
    </div>
  </div>

  {% set extra_scripts = ['js/hub.js'] %}
  {% include '_assets_foot.html' %}
</body>
</html>
