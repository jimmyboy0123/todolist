# Windows 桌面版：PyInstaller exe + Inno Setup 安装包

name: Build Windows Desktop

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**.py'
      - 'templates/**'
      - 'static/**'
      - 'todo_list.spec'
      - 'requirements.txt'
      - 'USER_README.txt'
      - 'installer/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build desktop EXE
        run: python -m PyInstaller todo_list.spec --clean -y

      - name: Copy user readme
        run: copy USER_README.txt dist\USER_README.txt

      - name: Verify EXE
        run: |
          if (-not (Test-Path dist\TodoList.exe)) { throw "dist\TodoList.exe missing" }
          (Get-Item dist\TodoList.exe).Length

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: TodoList-Portable
          path: |
            dist/TodoList.exe
            dist/USER_README.txt

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          Write-Host "Using ISCC: $iscc"
          New-Item -ItemType Directory -Force -Path installer\output | Out-Null
          & $iscc /Qp "$PWD\installer\TodoList.iss"
          Write-Host "Output directory listing:"
          Get-ChildItem -Recurse installer\output | Format-Table -AutoSize
          $setup = Get-ChildItem -Path installer\output -Filter TodoList-Setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) {
            Write-Host "Searching entire workspace for TodoList-Setup.exe ..."
            $setup = Get-ChildItem -Path $PWD -Recurse -Filter TodoList-Setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $setup) { throw "TodoList-Setup.exe was not created" }
          Write-Host "Installer: $($setup.FullName) ($($setup.Length) bytes)"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TodoList-Setup
          path: installer/output/TodoList-Setup.exe
