# 在 GitHub 云端自动打包 Windows exe，本机无需 Python
# 用法：推送到 main 后，在 Actions 页下载 TodoList-Windows 压缩包

name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**.py'
      - 'templates/**'
      - 'static/**'
      - 'todo_list.spec'
      - 'requirements.txt'
      - 'USER_README.txt'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: python -m PyInstaller todo_list.spec --clean -y

      - name: Copy user readme
        run: copy USER_README.txt dist\USER_README.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TodoList-Windows
          path: |
            dist/TodoList.exe
            dist/USER_README.txt
