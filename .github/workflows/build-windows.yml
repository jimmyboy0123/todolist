# Windows 桌面版：PyInstaller exe + Inno Setup 安装包

name: Build Windows Desktop

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**.py'
      - 'templates/**'
      - 'static/**'
      - 'todo_list.spec'
      - 'requirements.txt'
      - 'USER_README.txt'
      - 'installer/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build desktop EXE
        run: python -m PyInstaller todo_list.spec --clean -y

      - name: Copy user readme
        run: copy USER_README.txt dist\USER_README.txt

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: TodoList-Portable
          path: |
            dist/TodoList.exe
            dist/USER_README.txt

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        id: installer
        continue-on-error: true
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not found: $iscc" }
          & $iscc /Qp "installer\TodoList.iss"
          if (-not (Test-Path "installer\output\TodoList-Setup.exe")) { throw "TodoList-Setup.exe was not created" }

      - name: Upload installer
        if: steps.installer.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: TodoList-Setup
          path: installer/output/TodoList-Setup.exe

      - name: Fail if installer step failed
        if: steps.installer.outcome == 'failure'
        run: exit 1
